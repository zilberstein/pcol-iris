name = "pcol-iris"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PcolIris"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.style.header=false

[[lean_lib]]
name = "PcolIris"

[[require]]
name = "iris"
git.url = "https://github.com/leanprover-community/iris-lean.git" 
git.subDir = "Iris" 
rev = "master"

[[require]]
name = "convex-powerset"
git.url = "https://github.com/zilberstein/convex-powerset.git" 
rev = "main"

[[require]]
name = "pomsets-with-formulae"
git.url = "https://github.com/zilberstein/pomsets-with-formulae.git" 
rev = "main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"
